[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-awareness-spectral"
version = "0.3.0"
description = "Causal research protocol for evaluation cues, internal recognition, and behavioral propensity"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Anonymous" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<2.3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.8,<4", "pandas>=2.1,<3"]
extract = ["torch>=2.3", "transformers>=4.45", "tqdm>=4.66,<5"]
dev = [
  "build>=1.2,<2",
  "mypy>=1.10,<2",
  "pandas>=2.1,<3",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
]

[project.scripts]
eval-awareness-spectral = "eval_awareness_spectral.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eval_awareness_spectral = ["resources/*.json"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
# This gate is the accepted plan's exact correctness surface: claims, provenance,
# grouped splits, statistics, transfer, and spectral/operator validation. The full
# 69-test suite still runs; its broader modules are reported by test count, not by
# this scoped percentage.
branch = false
source = ["eval_awareness_spectral"]
omit = [
  "src/eval_awareness_spectral/__init__.py",
  "src/eval_awareness_spectral/cli.py",
  "src/eval_awareness_spectral/config.py",
  "src/eval_awareness_spectral/schemas.py",
  "src/eval_awareness_spectral/data/factors.py",
  "src/eval_awareness_spectral/data/manifests.py",
  "src/eval_awareness_spectral/evaluation/probes.py",
  "src/eval_awareness_spectral/evaluation/scaling.py",
  "src/eval_awareness_spectral/evaluation/selectivity.py",
  "src/eval_awareness_spectral/integrations/*.py",
  "src/eval_awareness_spectral/interventions/*.py",
  "src/eval_awareness_spectral/representations/residual.py",
  "src/eval_awareness_spectral/analysis.py",
  "src/eval_awareness_spectral/baselines.py",
  "src/eval_awareness_spectral/decomposition.py",
  "src/eval_awareness_spectral/law_mining.py",
  "src/eval_awareness_spectral/metric_study.py",
  "src/eval_awareness_spectral/prompts.py",
  "src/eval_awareness_spectral/separability.py",
  "src/eval_awareness_spectral/spans.py",
  "src/eval_awareness_spectral/spectral_transfer.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B018"]
"src/eval_awareness_spectral/{analysis,baselines,decomposition,law_mining,metric_study,prompts,separability,spans,spectral_transfer}.py" = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
"scripts/**/*.py" = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["eval_awareness_spectral"]
exclude = [
  "src/eval_awareness_spectral/(analysis|baselines|decomposition|law_mining|metric_study|prompts|separability|spans|spectral_transfer)\\.py",
]
ignore_missing_imports = true
warn_unused_ignores = true

